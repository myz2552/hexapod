name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11: Raspberry Pi OS Bookworm; 3.13: Raspberry Pi OS Trixie
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies (no hardware libraries)
        run: python -m pip install PyYAML
      - name: Compile
        run: python -m compileall -q software
      - name: Unit tests
        run: python -m unittest discover -s software -t . -v
